name: Auto-update README

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - 'api/**'
      - 'nginx/**'
      - 'prometheus/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/**'

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    # Fork PRs have no write access to the external branch — skip them
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with Claude
        uses: anthropics/claude-code-action@v1.0.142
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are maintaining README.md for a production Docker Compose application stack.

            PR #${{ github.event.pull_request.number }}: "${{ github.event.pull_request.title }}"

            Steps:
            1. Run: gh pr diff ${{ github.event.pull_request.number }}
            2. Read README.md
            3. Determine whether the diff introduces user-facing changes worth documenting:
               - New or changed API endpoints, ports, or services
               - New or changed environment variables (.env.example changes)
               - New prerequisites or setup steps
               - Changed architecture (new or removed compose.yaml services)
               - CI/CD changes that users or contributors need to know about:
                   * A new workflow file added (e.g. a CI pipeline that wasn't there before)
                   * How or when CD deploys changed (e.g. now requires CI to pass first)
                   * New quality gates added to PRs (lint, tests, coverage checks)
                   * New secrets or one-time setup steps required to use the repo
               NOT worth documenting: action version bumps, renaming jobs,
               workflow refactors whose observable behaviour is unchanged, adding tests.

               For any diff touching .github/workflows/: read the affected workflow files,
               then read the README CI/CD section and check whether it still accurately
               describes what the pipelines do. If it doesn't match, update it.
            4. If updates are needed: make surgical, minimal edits. Do not reformat or rewrite sections unaffected by the PR.
            5. If updates are needed: commit with message "docs: auto-update README for PR #${{ github.event.pull_request.number }} [skip ci]"
            6. If no updates are needed: do nothing and exit cleanly.
          claude_args: "--allowedTools Read,Edit,Bash --max-turns 10"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
