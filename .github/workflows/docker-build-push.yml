name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    # Only run if CI passed — never deploy a broken commit
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          # workflow_run fires on the default branch; check out the commit
          # that triggered CI so we build and tag the correct source tree
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nitink2306/docker-compose-app:latest
            nitink2306/docker-compose-app:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
